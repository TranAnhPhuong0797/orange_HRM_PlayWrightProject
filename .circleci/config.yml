version: 2.1

executors:
  pw:
    docker:
      - image: mcr.microsoft.com/playwright:v1.44.1-jammy
    working_directory: ~/project

parameters:
  test_env:
    type: string
    default: "dev"

# Reusable job: chạy 1 folder (suite) trên 1 browser; trong job có parallelism + sharding
jobs:
  run-suite:
    executor: pw
    parallelism: 2         # số container song song cho mỗi (suite,browser) -> điều chỉnh theo quy mô
    parameters:
      suite:
        type: string       # ví dụ: e2e/smokeTest hoặc e2e/DashBoard
      browser:
        type: enum
        enum: ["chromium", "firefox"]
      test_env:
        type: string
        default: "dev"

    steps:
      - checkout

      - restore_cache:
          key: npm-cache-{{ checksum "package-lock.json" }}

      - run:
          name: Install dependencies
          # Sử dụng npm ci để cài đặt nhanh và chính xác theo package-lock.json
          command: npm ci

      - save_cache:
          paths: [node_modules]
          key: npm-cache-{{ checksum "package-lock.json" }}

      - run:
          name: Install Playwright
          command: npx playwright install

      # Shard theo CircleCI
      - run:
          name: Run Playwright (folder + browser + shard)
          command: |
            SHARD_INDEX=$((CIRCLE_NODE_INDEX+1))
            SHARD_TOTAL=$CIRCLE_NODE_TOTAL

            echo "Folder: << parameters.suite >>"
            echo "Browser: << parameters.browser >>"
            echo "Shard: $SHARD_INDEX/$SHARD_TOTAL"

            # Tùy chọn: tránh ghi đè JUnit khi sharding
            export PW_JUNIT_OUTPUT="test-results/junit/results-<< parameters.browser >>-$SHARD_INDEX.xml"

            npx playwright test "<< parameters.suite >>" \
              --project="<< parameters.browser >>" \
              --shard="$SHARD_INDEX/$SHARD_TOTAL" \
              --reporter=junit,html

          environment:
            TEST_ENV: << parameters.test_env >>

      - store_test_results:
          path: test-results

      - store_artifacts:
          path: test-results
          destination: test-results

      - store_artifacts:
          path: playwright-report
          destination: playwright-report

workflows:
  version: 2

  # 1) PR / feature: chạy smoke nhanh trên 3 browsers
  pr_smoke:
    when: on_success
    jobs:
      - run-suite:
          name: smoke-<< matrix.browser >>
          matrix:
            parameters:
              suite: ["e2e/smokeTest"]
              browser: ["chromium", "firefox"]
          test_env: << pipeline.parameters.test_env >>
          filters:
            branches:
              only:
                - /feature\/.*/   # tuỳ naming convention
                - develop

  # 2) Module suites trên develop/main
  modules:
    when: on_success
    jobs:
      - run-suite:
          name: dashboard-<< matrix.browser >>
          matrix:
            parameters:
              suite: ["e2e/DashBoard"]
              browser: ["chromium", "firefox"]
          test_env: << pipeline.parameters.test_env >>
          filters:
            branches:
              only:
                - develop
                - main

      - run-suite:
          name: admin-<< matrix.browser >>
          matrix:
            parameters:
              suite: ["e2e/Admin"]
              browser: ["chromium", "firefox"]
          test_env: << pipeline.parameters.test_env >>
          filters:
            branches:
              only:
                - develop
                - main

      - run-suite:
          name: leave-<< matrix.browser >>
          matrix:
            parameters:
              suite: ["e2e/Leave"]
              browser: ["chromium", "firefox"]
          test_env: << pipeline.parameters.test_env >>
          filters:
            branches:
              only:
                - develop
                - main

  # 3) Nightly regression theo lịch (chạy full browsers)
  nightly_regression:
    triggers:
      - schedule:
          cron: "0 17 * * *"   # 00:00+07
          filters:
            branches:
              only:
                - main
    jobs:
      - run-suite:
          name: regression-<< matrix.browser >>
          matrix:
            parameters:
              suite: ["e2e/regressionTest"]
              browser: ["chromium", "firefox"]
          test_env: "staging"   # ví dụ: nightly chạy trên staging
